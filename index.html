<title>Living Organisms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a sticker-book field trip. Chunky outlined cards with hard shadows, a bottom tab bar for thumbs, one lesson slide at a time. Single bright daylight theme by choice. */
:root {
  color-scheme: light;
  --bg: #E3F4FF;
  --bg2: #E6F8EC;
  --paper: #FFFFFF;
  --ink: #10304A;
  --soft: #4B6A82;
  --blue: #1F6FEB;
  --leaf: #17A05D;
  --sun: #FFC21A;
  --coral: #F4553E;
  --ice: #D9EAFF;
  --mint: #D5F4E1;
  --lemon: #FFF0B3;
  --peach: #FFE0D8;
  --f-disp: "Baloo Bhaijaan 2", "Nunito", "Segoe UI", Tahoma, sans-serif;
  --f-body: "Nunito", "Baloo Bhaijaan 2", "Segoe UI", Tahoma, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(circle at 12% 8%, #fff 0 90px, transparent 91px), radial-gradient(circle at 88% 14%, #fff 0 60px, transparent 61px), linear-gradient(180deg, var(--bg) 0, var(--bg) 340px, var(--bg2) 100%);
  background-attachment: fixed;
  color: var(--ink); font-family: var(--f-body); font-size: 19px; line-height: 1.55;
  padding-inline: 16px; padding-block: 0 110px; direction: ltr; text-align: left;
}
h1, h2, h3, h4 { font-family: var(--f-disp); line-height: 1.2; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
svg { display: block; }
.ar { direction: rtl; text-align: right; font-family: var(--f-disp); font-size: 20px; line-height: 1.7; }
.wrap { max-width: 900px; margin-inline: auto; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding-block: 10px; background: linear-gradient(var(--bg) 70%, transparent); }
.bar .in { max-width: 900px; margin-inline: auto; display: flex; align-items: center; gap: 10px; }
.avatar { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; overflow: hidden; flex: none; }
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block; }
.brand { flex: 1; min-width: 0; font-family: var(--f-disp); font-weight: 800; font-size: 20px; line-height: 1.1; }
.brand small { display: block; font-weight: 600; font-size: 13px; color: var(--soft); }
.pillbtn { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 12px; font-family: var(--f-disp); font-weight: 700; box-shadow: 0 3px 0 var(--ink); min-height: 44px; }
.pillbtn svg { width: 22px; height: 22px; }
.starcount { background: var(--lemon); }
.starcount svg { fill: var(--sun); stroke: var(--ink); stroke-width: 1.6; }
.sndpanel { position: absolute; right: 0; top: 66px; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink); padding: 14px; display: none; flex-direction: column; gap: 12px; min-width: 240px; z-index: 30; }
.sndpanel.open { display: flex; }
.sndpanel b { font-family: var(--f-disp); font-size: 17px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; border: 3px solid var(--ink); background: #fff; border-radius: 12px; padding: 6px 10px; font-family: var(--f-disp); font-weight: 700; min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.bar .rel { position: relative; }

/* bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--paper); border-top: 3px solid var(--ink); padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; gap: 8px; }
.tabs button { flex: 1; max-width: 220px; border: 3px solid transparent; background: transparent; border-radius: 16px; padding: 4px 6px; font-family: var(--f-disp); font-weight: 800; font-size: 17px; display: flex; flex-direction: column; align-items: center; gap: 0; color: var(--soft); min-height: 56px; }
.tabs button svg { width: 28px; height: 28px; }
.tabs button[aria-selected="true"] { border-color: var(--ink); background: var(--sun); color: var(--ink); box-shadow: 0 3px 0 var(--ink); }

/* generic */
.card { background: var(--paper); border: 3px solid var(--ink); border-radius: 24px; box-shadow: 0 6px 0 var(--ink); padding: 18px; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--blue); color: #fff; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink); padding: 8px 22px; font-family: var(--f-disp); font-weight: 800; font-size: 20px; min-height: 52px; transition: transform .08s, box-shadow .08s; }
.btn:active:not([disabled]) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn.green { background: var(--leaf); } .btn.sun { background: var(--sun); color: var(--ink); } .btn.coral { background: var(--coral); }
.btn.ghost { background: var(--paper); color: var(--ink); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn svg { width: 22px; height: 22px; }
.rowx { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.hide { display: none !important; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.pic { background: #fff; border: 3px solid var(--ink); border-radius: 20px; overflow: hidden; margin: 0; display: flex; align-items: center; justify-content: center; padding: 6px; min-width: 0; }
.pic img { display: block; max-width: 100%; height: auto; }
.pic.wide { padding: 0; } .pic.wide img { width: 100%; }
.pic.tint img, .tile img { mix-blend-mode: multiply; }

/* learn list */
.hello { display: flex; flex-direction: column; gap: 6px; padding-block: 8px 18px; }
.hello h1 { font-size: clamp(34px, 8vw, 54px); font-weight: 800; }
.hello h1 mark { background: linear-gradient(transparent 55%, var(--sun) 55%); color: inherit; padding-inline: 4px; }
.lessons { display: grid; gap: 22px; }
.lcard { display: grid; grid-template-columns: 200px 1fr; gap: 16px; align-items: center; cursor: pointer; text-align: left; }
.lcard .pic { height: 150px; }
.lcard .pic img { width: 100%; height: 100%; object-fit: cover; }
.lcard h3 { font-size: 26px; }
.lcard .meta { color: var(--soft); font-weight: 700; font-size: 16px; }
.prog { height: 16px; border: 3px solid var(--ink); border-radius: 99px; background: #fff; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--leaf); transition: width .3s; }
.badge-n { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 10px; border: 3px solid var(--ink); background: var(--sun); font-family: var(--f-disp); font-weight: 800; }

/* player */
.ptop { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.ptop .prog { flex: 1; }
.ptop .ttl { font-family: var(--f-disp); font-weight: 800; font-size: 18px; display: none; }
.slide { animation: pop .28s ease-out; display: flex; flex-direction: column; gap: 18px; }
@keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.pfoot { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; }
.titlebar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.titlebar h2 { font-size: clamp(28px, 6vw, 42px); font-weight: 800; }
.titlebar .n { width: 54px; height: 62px; border: 3px solid var(--ink); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--f-disp); font-weight: 800; font-size: 44px; box-shadow: 0 4px 0 var(--ink); }
.titlebar .n.y { background: var(--sun); color: var(--coral); } .titlebar .n.w { background: #fff; color: var(--blue); }
.ribbon { background: var(--ink); color: #fff; padding: 10px 26px; text-align: center; clip-path: polygon(1% 8%, 99% 0, 100% 86%, 98.5% 100%, 1.5% 94%, 0 70%); align-self: center; max-width: 100%; }
.ribbon h2 { font-size: clamp(22px, 5vw, 32px); font-weight: 700; }
.bubble { background: #fff; border: 3px dashed var(--blue); border-radius: 40px; padding: 12px 24px; text-align: center; align-self: center; max-width: 560px; }
.say-big, .bubble .rd, .rd { font-size: 23px; line-height: 1.7; }
.rd { position: relative; }
.rd.ans { color: var(--ink); }
.task { font-size: 24px; color: var(--blue); }
.hl { color: var(--blue); font-weight: 800; }
.red { color: var(--coral); font-weight: 800; }
.grtag { display: inline-flex; align-items: baseline; background: var(--sun); border: 2px solid var(--ink); border-radius: 8px; padding: 0 9px; font-family: var(--f-disp); font-weight: 800; font-size: 18px; margin-inline: 4px; vertical-align: middle; line-height: 1.5; }
.grtag b { color: var(--coral); margin-left: 2px; }
.w { border-radius: 6px; cursor: pointer; transition: background .1s; }
.w:hover { background: var(--lemon); }
.w.on { background: var(--sun); box-shadow: 0 0 0 3px var(--sun); }
.spk { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--ink); background: var(--sun); box-shadow: 0 3px 0 var(--ink); margin-inline: 0 10px; vertical-align: middle; padding: 0; flex: none; }
.spk svg { width: 20px; height: 20px; fill: var(--ink); }
.spk:active { transform: translateY(3px); box-shadow: none; }
.hint-ar { align-self: flex-start; }
.hint-ar .btn { font-size: 16px; min-height: 42px; padding: 4px 16px; box-shadow: 0 3px 0 var(--ink); }
.arbox { background: var(--mint); border: 3px solid var(--ink); border-radius: 18px; padding: 12px 18px; margin-top: 10px; }

.meant { background: var(--lemon); border: 3px dashed var(--ink); border-radius: 20px; padding: 14px 20px; display: flex; flex-direction: column; gap: 6px; }
.meant .q { font-family: var(--f-disp); font-weight: 800; font-size: 26px; }
.meant .q b { color: var(--coral); } .meant .q i { color: var(--blue); font-style: normal; }
.meant.illus { background: var(--ice); border-style: dotted; }
.excl { display: inline-flex; width: 30px; height: 30px; border-radius: 50%; background: var(--coral); color: #fff; font-family: var(--f-disp); font-weight: 800; align-items: center; justify-content: center; margin-right: 8px; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.box { background: var(--paper); border: 3px solid var(--blue); border-radius: 22px; padding: 30px 12px 14px; position: relative; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.box .tag { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); background: var(--blue); color: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 2px 20px; font-family: var(--f-disp); font-weight: 800; font-size: 20px; white-space: nowrap; max-width: 96%; }
.box .such { text-align: center; text-decoration: underline; text-underline-offset: 5px; }
.box.nl .tag { background: var(--leaf); } .box.nl { border-color: var(--leaf); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: #fff; border: 3px solid transparent; border-radius: 16px; padding: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.tile:hover { border-color: var(--sun); }
.tile.on { border-color: var(--sun); background: var(--lemon); }
.tile .im { height: 120px; display: flex; align-items: center; justify-content: center; width: 100%; }
.tile img { max-height: 112px; max-width: 100%; width: auto; height: auto; }
.tile b { font-family: var(--f-disp); font-weight: 800; font-size: 21px; color: var(--coral); }
.tile.g b { color: var(--leaf); }
.tiles.big .im { height: 170px; } .tiles.big img { max-height: 160px; }
.tag-g { display: inline-block; background: var(--leaf); color: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 0 14px; font-family: var(--f-disp); font-weight: 800; font-size: 21px; }

.strip5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.strip5 .tile .im { height: 80px; } .strip5 .tile img { max-height: 76px; }
.strip5 .tile b { font-size: 16px; color: var(--ink); }

/* habitat panels & steps */
.panel { background: var(--paper); border: 3px solid var(--blue); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel .head { display: flex; gap: 10px; align-items: flex-start; font-family: var(--f-disp); font-weight: 800; font-size: 25px; line-height: 1.25; }
.num { background: var(--blue); color: #fff; border: 3px solid var(--ink); border-radius: 10px; min-width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--f-disp); font-weight: 800; flex: none; font-size: 22px; }
.num.round { border-radius: 50%; }
.bl { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.bl li { display: flex; gap: 10px; align-items: baseline; }
.bl li::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--blue); flex: none; transform: translateY(1px); }
.bl li > .rd { flex: 1; min-width: 0; }
.such2 { align-self: flex-start; border: 3px solid var(--blue); color: var(--blue); border-radius: 999px; padding: 0 16px; font-family: var(--f-disp); font-weight: 800; font-size: 20px; background: #fff; }
.step { background: var(--paper); border: 3px solid var(--blue); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.step .head { display: flex; align-items: center; gap: 12px; font-family: var(--f-disp); font-weight: 800; font-size: 34px; }
.step .pic { max-width: 440px; align-self: center; width: 100%; }
.stepgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: center; }

/* widgets */
.wg { background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 5px 0 var(--ink); padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.wg .instr { font-family: var(--f-disp); font-weight: 700; font-size: 20px; color: var(--soft); }
.pool { display: flex; flex-wrap: wrap; gap: 10px; min-height: 58px; }
.chipb { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 4px 14px; font-family: var(--f-disp); font-weight: 700; font-size: 20px; box-shadow: 0 3px 0 var(--ink); min-height: 46px; text-align: left; line-height: 1.2; }
.chipb img { height: 44px; width: auto; mix-blend-mode: multiply; }
.chipb:active:not([disabled]) { transform: translateY(3px); box-shadow: none; }
.chipb[aria-pressed="true"] { background: var(--ice); border-color: var(--blue); box-shadow: 0 0 0 4px var(--blue); }
.chipb.good { background: var(--mint); border-color: var(--leaf); box-shadow: 0 3px 0 var(--leaf); }
.chipb.bad { background: var(--peach); border-color: var(--coral); box-shadow: 0 3px 0 var(--coral); }
.chipb[disabled] { cursor: default; }
.bins { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bin { border: 3px dashed var(--ink); border-radius: 18px; padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; min-width: 0; background: var(--bg); }
.bin > button { background: var(--blue); color: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 6px 10px; font-family: var(--f-disp); font-weight: 800; font-size: 19px; line-height: 1.25; min-height: 48px; }
.bin.b2 > button { background: var(--leaf); }
.bin .drop { display: flex; flex-wrap: wrap; gap: 8px; }
.msg { min-height: 1.7em; font-family: var(--f-disp); font-weight: 700; font-size: 20px; }
.msg.ok { color: var(--leaf); } .msg.no { color: var(--coral); }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
.answer { min-height: 66px; border: 3px dashed var(--blue); border-radius: 16px; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; background: var(--ice); align-content: flex-start; }
.answer .chipb { background: var(--lemon); }
.answer:empty::before { content: attr(data-ph); color: var(--soft); font-family: var(--f-disp); font-weight: 600; padding: 8px; }
.checker .res { display: flex; flex-direction: column; gap: 8px; }
.checker .res div { display: flex; align-items: center; gap: 12px; font-family: var(--f-disp); font-weight: 800; font-size: 24px; }
.mk { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--ink); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.mk svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 3.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.mk.y { background: var(--leaf); } .mk.n { background: var(--coral); }
.ckgrid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 16px; align-items: center; }
.verdict { font-family: var(--f-disp); font-weight: 800; font-size: 24px; margin-top: 6px; }
.matchg { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; align-items: stretch; }
.matchg .col { display: flex; flex-direction: column; gap: 10px; }
.matchg .chipb { justify-content: center; text-align: center; width: 100%; font-size: 19px; }

.dtable { width: 100%; border-collapse: separate; border-spacing: 0; border: 3px solid var(--blue); border-radius: 18px; overflow: hidden; background: #fff; }
.dtable th { background: var(--blue); color: #fff; font-family: var(--f-disp); font-weight: 800; font-size: 21px; padding: 8px 14px; }
.dtable td { padding: 8px 14px; border-top: 3px dashed var(--ice); vertical-align: middle; font-size: 21px; }
.dtable td.o { font-family: var(--f-disp); font-weight: 800; font-size: 24px; width: 46%; }
.dtable td.o span { display: inline-flex; align-items: center; gap: 12px; }
.dtable td.o img { height: 62px; width: auto; mix-blend-mode: multiply; }
.dtable.guess td.p { filter: blur(9px); cursor: pointer; user-select: none; }
.dtable.guess td.p.open { filter: none; }
.tw { overflow-x: auto; }
.caut { display: grid; grid-template-columns: 190px 1fr; gap: 18px; align-items: center; background: var(--peach); border: 3px solid var(--coral); border-radius: 24px; padding: 16px; }
.caut .pic { background: transparent; border: 0; padding: 0; } .caut .pic img { mix-blend-mode: multiply; max-height: 280px; width: auto; }
.caut h3 { color: var(--coral); font-size: 36px; display: flex; align-items: center; gap: 10px; }
.caut h3 svg { width: 38px; height: 38px; fill: var(--coral); stroke: var(--ink); stroke-width: 1.5; }

.wcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
.wc { background: #fff; border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); min-height: 96px; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; }
.wc:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.wc .e { font-family: var(--f-disp); font-weight: 800; font-size: 24px; line-height: 1.15; display: flex; align-items: center; gap: 6px; }
.wc .e svg { width: 20px; height: 20px; fill: var(--blue); flex: none; }
.wc .a { font-family: var(--f-disp); font-size: 22px; color: var(--leaf); font-weight: 700; direction: rtl; display: none; }
.wc.open { background: var(--mint); } .wc.open .a { display: block; }
.wc .tp { font-size: 13px; color: var(--soft); font-weight: 700; } .wc.open .tp { display: none; }
.sect-h { display: flex; align-items: center; gap: 10px; margin-block: 8px 12px; }
.sect-h h3 { font-size: 26px; }

/* record */
.recg { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.clip { background: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 10px 14px; min-height: 180px; box-shadow: 0 4px 0 var(--ink); display: flex; flex-direction: column; gap: 6px; }
.clip .hd { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-family: var(--f-disp); font-weight: 800; border-bottom: 3px solid var(--ink); padding-bottom: 4px; }
.clip .ln { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; border-bottom: 2px dashed var(--ice); }

/* test */
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.sec { text-align: left; background: #fff; border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 5px 0 var(--ink); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-height: 108px; }
.sec:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.sec .t { font-family: var(--f-disp); font-weight: 800; font-size: 22px; line-height: 1.2; }
.sec .c { color: var(--soft); font-weight: 700; font-size: 15px; }
.sec .best { margin-top: auto; font-size: 14px; font-weight: 800; color: var(--leaf); }
.sec.big { background: var(--sun); }
.sec.big2 { background: var(--mint); }
.filter { display: flex; flex-wrap: wrap; gap: 8px; }
.qcard { display: flex; flex-direction: column; gap: 16px; }
.qhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.qtype { background: var(--blue); color: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 0 12px; font-family: var(--f-disp); font-weight: 800; font-size: 17px; }
.qtext { font-family: var(--f-disp); font-weight: 700; font-size: 26px; line-height: 1.35; }
.qtext .blank { display: inline-block; min-width: 110px; border-bottom: 4px solid var(--blue); text-align: center; color: var(--leaf); }
.qimg { align-self: center; max-width: 340px; }
.opts { display: grid; gap: 10px; }
.opts.g2 { grid-template-columns: 1fr 1fr; }
.opt { display: flex; align-items: center; gap: 10px; justify-content: flex-start; text-align: left; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 8px 16px; font-family: var(--f-disp); font-weight: 700; font-size: 22px; line-height: 1.3; min-height: 58px; box-shadow: 0 4px 0 var(--ink); }
.opt:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.opt.good { background: var(--mint); border-color: var(--leaf); box-shadow: 0 4px 0 var(--leaf); }
.opt.bad { background: var(--peach); border-color: var(--coral); box-shadow: 0 4px 0 var(--coral); }
.opt[disabled] { cursor: default; }
.opt img { height: 90px; width: auto; max-width: 100%; mix-blend-mode: multiply; }
.opts.imgs { grid-template-columns: 1fr 1fr; } .opts.imgs .opt { justify-content: center; flex-direction: column; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tf .opt { justify-content: center; font-size: 28px; min-height: 76px; }
.tf .opt svg { width: 30px; height: 30px; stroke: var(--ink); stroke-width: 3.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.inp { font: inherit; font-family: var(--f-disp); font-weight: 700; font-size: 26px; padding: 8px 14px; border: 3px solid var(--ink); border-radius: 14px; width: 100%; max-width: 420px; background: #fff; color: var(--ink); direction: ltr; }
.blanks { letter-spacing: .3em; font-family: var(--f-disp); font-weight: 800; font-size: 26px; color: var(--soft); }
.fbk { border: 3px solid var(--ink); border-radius: 18px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.fbk.ok { background: var(--mint); } .fbk.no { background: var(--peach); }
.fbk h4 { font-size: 26px; display: flex; align-items: center; gap: 10px; }
.fbk .ex { font-size: 20px; }
.rbig { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.rbig .stars { display: flex; gap: 8px; justify-content: center; }
.rbig .stars svg { width: 56px; height: 56px; fill: #fff; stroke: var(--ink); stroke-width: 1.6; }
.rbig .stars svg.f { fill: var(--sun); }
.rbig .sc { font-family: var(--f-disp); font-weight: 800; font-size: 54px; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px; font-family: var(--f-disp); font-weight: 700; z-index: 50; max-width: 90vw; text-align: center; }
.starpop { position: fixed; z-index: 60; pointer-events: none; width: 54px; height: 54px; fill: var(--sun); stroke: var(--ink); stroke-width: 1.6; animation: rise .9s ease-out forwards; }
@keyframes rise { from { opacity: 1; transform: translateY(0) scale(.6); } to { opacity: 0; transform: translateY(-90px) scale(1.3); } }

@media (max-width: 720px) {
  body { font-size: 18px; }
  .two, .bins, .ckgrid, .matchg, .stepgrid, .recg, .opts.g2 { grid-template-columns: 1fr; }
  .lcard { grid-template-columns: 1fr; }
  .lcard .pic { height: 170px; }
  .caut { grid-template-columns: 1fr; justify-items: center; }
  .strip5 { grid-template-columns: repeat(3, 1fr); }
  .tiles { gap: 4px; } .tile b { font-size: 18px; }
  .rd, .bubble .rd { font-size: 21px; }
  .tf { gap: 10px; } .opts.imgs { grid-template-columns: 1fr 1fr; }
  .brand { font-size: 17px; } .brand small { display: none; }
}
@media (prefers-reduced-motion: reduce) { .slide, .shake, .starpop { animation: none; } .prog i { transition: none; } }
/* ===== exam + book questions ===== */
.cloze { font-family: var(--f-disp); font-weight: 700; font-size: 24px; line-height: 2.2; }
.slotb { display: inline-flex; align-items: center; justify-content: center; min-width: 120px; min-height: 46px; padding: 0 14px; vertical-align: middle; margin-inline: 4px; background: var(--ice); border: 3px dashed var(--blue); border-radius: 12px; font: inherit; color: var(--ink); cursor: pointer; }
.slotb.has { background: var(--lemon); border-style: solid; border-color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
.slotb.good, .inp-b.good { background: var(--mint); border-color: var(--leaf); box-shadow: 0 3px 0 var(--leaf); }
.slotb.bad, .inp-b.bad { background: var(--peach); border-color: var(--coral); box-shadow: 0 3px 0 var(--coral); }
.inp-b { width: auto; min-height: 46px; padding: 2px 10px; font-size: 22px; text-align: center; vertical-align: middle; margin-inline: 4px; max-width: 100%; border-radius: 12px; }
.ta { max-width: 640px; resize: vertical; font-size: 22px; font-family: var(--f-body); font-weight: 700; line-height: 1.4; }
.cbx { width: 28px; height: 28px; border: 3px solid var(--ink); border-radius: 8px; flex: none; background: #fff; }
.opt.sel { border-color: var(--blue); background: var(--ice); box-shadow: 0 4px 0 var(--blue); }
.opt.sel .cbx { background: var(--blue); box-shadow: inset 0 0 0 4px #fff; }
.lvl { display: inline-flex; gap: 2px; margin-left: auto; }
.lvl svg, .pips svg { width: 22px; height: 22px; fill: #fff; stroke: var(--ink); stroke-width: 1.8; }
.lvl svg.f, .pips svg.f { fill: var(--sun); }
.pips { display: inline-flex; gap: 2px; }
.lab2 { font-family: var(--f-disp); font-weight: 800; color: var(--soft); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; margin: 0; }
.sect-title { font-size: 26px; font-weight: 800; }
.meta { color: var(--soft); font-weight: 700; font-size: 16px; display: block; }

.gcard, .lvc { gap: 8px; }
.gno { background: var(--blue); color: #fff; width: auto; min-width: 36px; padding: 0 10px; }
.gtitle { font-size: 22px; line-height: 1.25; flex: 1; min-width: 0; }
.mseg { max-width: 360px; }
.mseg button { font-size: 20px; }
.revbox { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--peach); cursor: pointer; width: 100%; font-size: 21px; }
.revbox svg { width: 26px; height: 26px; margin-left: auto; }

.coverbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; padding: 10px 14px; box-shadow: 0 4px 0 var(--ink); }
.coverbar .btn { min-height: 44px; padding: 2px 16px; font-size: 18px; box-shadow: 0 3px 0 var(--ink); }
.scard > * { min-width: 0; }
.scard { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; padding: 16px; }
.bq { font-family: var(--f-disp); font-weight: 700; font-size: 24px; line-height: 1.5; }
.sent { font-family: var(--f-disp); font-weight: 600; font-size: 24px; line-height: 1.9; }
.bankline { font-family: var(--f-disp); font-weight: 700; color: var(--blue); font-size: 22px; }
.ansl { font-size: 22px; background: var(--mint); border-radius: 14px; padding: 10px 14px; border: 3px solid var(--leaf); font-weight: 600; line-height: 1.8; }
.why { color: var(--soft); font-size: 20px; }
.fa { background: var(--mint); color: var(--ink); border-radius: 8px; padding: 0 8px; font-weight: 800; }
.remember { background: var(--lemon); border: 2px dashed var(--ink); border-radius: 12px; padding: 8px 12px; font-size: 18px; margin: 0; }
.tfrow { display: flex; }
.tfb { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-disp); font-weight: 800; font-size: 24px; border: 3px solid var(--ink); border-radius: 14px; padding: 2px 16px 2px 10px; }
.tfb.y { background: var(--mint); } .tfb.n { background: var(--peach); }
.tfb svg { width: 28px; height: 28px; stroke: var(--ink); stroke-width: 3.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.optl { margin: 0; padding-left: 30px; display: flex; flex-direction: column; gap: 4px; font-size: 21px; }
.optl li.okopt { background: var(--mint); border-radius: 8px; font-weight: 800; padding: 0 8px; }
.hw { display: inline-block; max-width: 100%; overflow-wrap: anywhere; font: inherit; font-weight: 800; letter-spacing: .08em; padding: 0 10px; border: 3px solid var(--ink); border-radius: 10px; background: var(--lemon); color: var(--ink); min-height: 40px; line-height: 1.2; box-shadow: 0 3px 0 var(--ink); margin-inline: 2px; cursor: pointer; }
.hw:active { transform: translateY(3px); box-shadow: none; }
.hw.tfh { min-width: 70px; font-size: 24px; }
.shown { background: var(--mint); border-radius: 8px; padding: 0 6px; font-weight: 800; }
.exg-note { color: var(--soft); }
@media (max-width: 720px) {
  .scard { grid-template-columns: 1fr; gap: 8px; }
  .cloze, .sent, .bq { font-size: 22px; }
  .slotb { min-width: 96px; }
  .opts.g2 { grid-template-columns: 1fr; }
}

var Snd = { ok: ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window), slow: false, accent: 'US', voices: [] };
function loadVoices() { if (!Snd.ok) return; try { Snd.voices = speechSynthesis.getVoices().filter(function (v) { return /^en/i.test(v.lang); }); } catch (e) {} }
if (Snd.ok) { loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {} }
function pickVoice() {
  var want = Snd.accent === 'UK' ? /^en[-_]GB/i : /^en[-_]US/i, best = null, bs = -1;
  Snd.voices.forEach(function (v) {
    var s = 0;
    if (want.test(v.lang)) s += 10;
    if (/natural|neural|premium|enhanced|online/i.test(v.name)) s += 4;
    if (/google|samantha|aria|jenny|sonia|libby|ava|allison|serena|karen|daniel/i.test(v.name)) s += 3;
    if (/compact|novelty|whisper|bad|zarvox|albert|bells|boing|organ|trinoids/i.test(v.name)) s -= 8;
    if (s > bs) { bs = s; best = v; }
  });
  return best;
}
function clearOn() { $$('.w.on').forEach(function (w) { w.classList.remove('on'); }); }
function speak(text, rd) {
  if (!Snd.ok) { toast('Sound is not available on this device.'); return; }
  try { speechSynthesis.cancel(); } catch (e) {}
  clearOn();
  var u = new SpeechSynthesisUtterance(text), v = pickVoice();
  if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = Snd.accent === 'UK' ? 'en-GB' : 'en-US'; }
  u.rate = Snd.slow ? 0.6 : 0.9; u.pitch = 1.05;
  if (rd && rd._ws) {
    u.onboundary = function (ev) {
      if (ev.name && ev.name !== 'word') return;
      clearOn();
      for (var k = 0; k < rd._ws.length; k++) { var w = rd._ws[k]; if (ev.charIndex >= w.s && ev.charIndex < w.e) { w.el.classList.add('on'); break; } }
    };
    u.onend = u.onerror = clearOn;
  }
  try { speechSynthesis.speak(u); } catch (e) { toast('Sound is not available on this device.'); }
}

function prepRd(p) {
  p.setAttribute('data-done', '1');
  var walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT, null), nodes = [], n;
  while ((n = walker.nextNode())) { if (n.parentNode.closest('button,.spk,.grtag,.excl,.blank')) continue; nodes.push(n); }
  nodes.forEach(function (t) {
    var s = t.nodeValue; if (!/[A-Za-z0-9]/.test(s)) return;
    var frag = document.createDocumentFragment(), re = /[A-Za-z0-9][A-Za-z0-9'’\-]*/g, last = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      var sp = document.createElement('span'); sp.className = 'w'; sp.textContent = m[0]; frag.appendChild(sp); last = m.index + m[0].length;
    }
    if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
    t.parentNode.replaceChild(frag, t);
  });
  var c = p.cloneNode(true); $$('.grtag,.excl,.spk', c).forEach(function (x) { x.remove(); }); $$('.blank', c).forEach(function (x) { x.textContent = 'blank'; }); $$('.hw', c).forEach(function (x) { x.textContent = x.getAttribute('data-w'); });
  p._text = c.textContent.replace(/\s+/g, ' ').trim();
  var pos = 0; p._ws = [];
  $$('.w', p).forEach(function (w) {
    var i = p._text.indexOf(w.textContent, pos); if (i < 0) i = pos;
    p._ws.push({ el: w, s: i, e: i + w.textContent.length }); pos = i + w.textContent.length;
  });
  var b = el('button', 'spk', icon('spk')); b.type = 'button'; b.setAttribute('aria-label', 'Listen');
  p.insertBefore(b, p.firstChild);
}
function hydrate(root) {
  $$('img[data-img]', root).forEach(function (im) { if (!im.getAttribute('src')) im.src = IMG[im.getAttribute('data-img')]; });
  $$('.rd:not([data-done])', root).forEach(prepRd);
}
document.addEventListener('click', function (e) {
  var t = e.target, spk = t.closest('.spk');
  if (spk) { var rd = spk.closest('.rd'); if (rd) speak(rd._text, rd); return; }
  var w = t.closest('.w');

  var ds = t.closest('[data-say]');
  if (ds) {
    speak(ds.getAttribute('data-say'));
    if (ds.classList.contains('tile')) { ds.classList.add('on'); setTimeout(function () { ds.classList.remove('on'); }, 700); }
    return;
  }
  var rv = t.closest('[data-reveal]');
  if (rv) {
    var box = rv.nextElementSibling; box.classList.remove('hide'); rv.classList.add('hide'); hydrate(box);
    award('rv:' + (rv.getAttribute('data-reveal'))); var r2 = $('.rd', box); if (r2) speak(r2._text, r2);
    return;
  }
  var ar = t.closest('[data-ar]');
  if (ar) { var bx = ar.nextElementSibling; bx.classList.toggle('hide'); ar.setAttribute('aria-expanded', String(!bx.classList.contains('hide'))); return; }
  if (!t.closest('#sndPanel') && !t.closest('#sndBtn')) { $('#sndPanel').classList.remove('open'); $('#sndBtn').setAttribute('aria-expanded', 'false'); }
});

function sortWidget(host, cfg) {
  host.innerHTML = '';
  var pool = el('div', 'pool'), bins = el('div', 'bins'), msg = el('p', 'msg'), sel = null, left = cfg.items.length, mistakes = 0;
  msg.setAttribute('role', 'status');
  cfg.bins.forEach(function (b, bi) {
    var w = el('div', 'bin b' + (bi + 1)), btn = el('button', null, esc(b.label)), drop = el('div', 'drop');
    btn.type = 'button'; w.appendChild(btn); w.appendChild(drop); bins.appendChild(w);
    btn.addEventListener('click', function () {
      if (!sel) { msg.className = 'msg'; msg.textContent = 'Tap a card first.'; return; }
      if (sel.it.bin === b.id) {
        sel.c.setAttribute('aria-pressed', 'false'); sel.c.disabled = true; sel.c.classList.add('good'); drop.appendChild(sel.c);
        msg.className = 'msg ok'; msg.textContent = 'Yes!'; sel = null; left--;
        if (!left) { msg.textContent = 'Great job!'; if (cfg.onDone) cfg.onDone(mistakes); }
      } else { mistakes++; msg.className = 'msg no'; msg.textContent = 'Try again!'; shake(w); }
    });
  });
  shuffle(cfg.items).forEach(function (it) {
    var c = el('button', 'chipb', (it.img ? '<img src="' + IMG[it.img] + '" alt="">' : '') + esc(it.label));
    c.type = 'button'; c.setAttribute('aria-pressed', 'false');
    c.addEventListener('click', function () {
      $$('.chipb', pool).forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      c.setAttribute('aria-pressed', 'true'); sel = { it: it, c: c }; msg.className = 'msg'; msg.textContent = '';
      speak(it.say || it.label);
    });
    pool.appendChild(c);
  });
  if (cfg.instr) host.appendChild(el('p', 'instr', esc(cfg.instr)));
  host.appendChild(pool); host.appendChild(bins); host.appendChild(msg);
}

function buildWidget(host, cfg) {
  host.innerHTML = '';
  var ans = el('div', 'answer'), pool = el('div', 'pool'), msg = el('p', 'msg'), row = el('div', 'rowx'), seq = [], locked = false, mistakes = 0;
  var bank = shuffle(cfg.tokens.map(function (t, i) { return { t: t, i: i }; }));
  var full = cfg.say || cfg.tokens.join(' ');
  msg.setAttribute('role', 'status');
  var listen = el('button', 'btn ghost', icon('spk') + 'Listen'), reset = el('button', 'btn ghost', 'Start again');
  listen.type = 'button'; reset.type = 'button'; if (!cfg.nolisten) row.appendChild(listen); row.appendChild(reset);
  ans.setAttribute('data-ph', cfg.mute ? 'Tap the letters in order' : 'Tap the words in order');
  listen.addEventListener('click', function () { speak(full); });
  function draw() {
    ans.innerHTML = ''; pool.innerHTML = '';
    seq.forEach(function (o, k) {
      var b = el('button', 'chipb', esc(o.t)); b.type = 'button'; b.disabled = locked;
      if (locked) b.classList.add('good');
      b.addEventListener('click', function () { if (locked) return; seq.splice(k, 1); bank.push(o); msg.textContent = ''; draw(); });
      ans.appendChild(b);
    });
    bank.forEach(function (o) {
      var b = el('button', 'chipb', esc(o.t)); b.type = 'button'; b.disabled = locked;
      b.addEventListener('click', function () {
        if (locked) return; if (!cfg.mute) speak(o.t.replace(/[,.]/g, ''));
        bank.splice(bank.indexOf(o), 1); seq.push(o); draw();
        if (!bank.length) {
          var ok = seq.every(function (s, k) { return s.t === cfg.tokens[k]; });
          if (ok) { locked = true; msg.className = 'msg ok'; msg.textContent = 'Perfect!'; draw(); setTimeout(function () { speak(full); }, 450); if (cfg.onDone) cfg.onDone(mistakes); }
          else { mistakes++; msg.className = 'msg no'; msg.textContent = 'Not yet. Tap a word to take it back.'; shake(ans); }
        }
      });
      pool.appendChild(b);
    });
  }
  reset.addEventListener('click', function () { if (locked) return; bank = shuffle(bank.concat(seq)); seq = []; msg.textContent = ''; draw(); });
  if (cfg.instr) host.appendChild(el('p', 'instr', esc(cfg.instr)));
  host.appendChild(ans); host.appendChild(pool); host.appendChild(row); host.appendChild(msg); draw();
}

    var rv = el('button', 'card revbox', '<span class="badge-n" style="background:var(--coral);color:#fff">' + miss + '</span><span><b>Review box</b><span class="meta">Questions to try again</span></span>' + icon('next'));
    rv.type = 'button'; rv.addEventListener('click', function () { startTest({ key: 'review', title: 'Review box', list: shuffle(missedList()), back: function () { showTab('book'); } }); }); root.appendChild(rv);
  }
  ['El-Moasser Book', 'School Book'].forEach(function (bk) {
    var sec = el('div', 'stack', '<h3 class="sect-title">' + bk + '</h3>'), grid = el('div', 'sgrid');
    BG.filter(function (g) { return g.book === bk; }).forEach(function (g) {
      var n = g.items.length;
      var c = el('button', 'sec gcard', '<span class="rowx" style="flex-wrap:nowrap"><span class="badge-n gno">' + esc(g.no) + '</span>' + pips(g.id) + '</span><span class="t">' + esc(g.title) + '</span><span class="c">' + n + (n === 1 ? ' question' : ' questions') + '</span>');
      c.type = 'button'; c.addEventListener('click', function () { BV.cover = 0; openGroup(g.id, 'study'); }); grid.appendChild(c);
    });
    sec.appendChild(grid); root.appendChild(sec);
  });
  window.scrollTo(0, 0);
}
function openGroup(gid, mode) {
  BV.gid = gid; BV.mode = mode; var g = BG.filter(function (x) { return x.id === gid; })[0];
  var h = $('#p-book');
  h.innerHTML = '<div class="ptop"><button type="button" class="btn ghost" id="bb" aria-label="All questions">' + icon('prev') + '</button><span class="badge-n gno">' + esc(g.no) + '</span><h2 class="gtitle">' + esc(g.title) + '</h2></div>' +
    '<div class="seg mseg" id="mseg"><button type="button" data-v="study">Study</button><button type="button" data-v="try">Try it</button></div><div id="gbody" class="stack" style="gap:16px;margin-top:14px"></div>';
  $('#bb').addEventListener('click', renderBook);
  $$('#mseg button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === mode));
    b.addEventListener('click', function () { openGroup(gid, b.getAttribute('data-v')); });
  });
  if (mode === 'study') drawStudy(g); else drawTry(g);
  hydrate(h); window.scrollTo(0, 0);
}
function drawStudy(g) {
  var body = $('#gbody'), lv = BV.cover;
  body.innerHTML = '<div class="coverbar"><span class="lab2">Cover the answers</span><button type="button" class="btn ghost" id="cvm"' + (lv === 0 ? ' disabled' : '') + '>Show more</button><span class="pips cvp" aria-hidden="true">' +
    [1, 2, 3].map(function (i) { return '<svg class="' + (i <= lv ? 'f' : '') + '"><use href="#i-star"/></svg>'; }).join('') + '</span><button type="button" class="btn sun" id="cvh"' + (lv === 3 ? ' disabled' : '') + '>Hide more</button></div>' +
    '<div class="stack" id="cards" style="gap:16px"></div>';
  g.items.forEach(function (it, i) { $('#cards').insertAdjacentHTML('beforeend', studyCard(it, g.items.length > 1 ? (it.id.indexOf('.') > 0 ? it.id.split('.')[1] : i + 1) : '•', lv)); });
  $('#cvm').addEventListener('click', function () { BV.cover = Math.max(0, BV.cover - 1); drawStudy(g); hydrate($('#p-book')); });
  $('#cvh').addEventListener('click', function () { BV.cover = Math.min(3, BV.cover + 1); drawStudy(g); hydrate($('#p-book')); });
}
function drawTry(g) {
  var body = $('#gbody'), info = [['Easy', 'Choose the answers'], ['Medium', 'Fill in and build the answers'], ['Hard', 'Write the answers yourself']];
  body.innerHTML = '<div class="sgrid" id="lvg"></div>';
  [1, 2, 3].forEach(function (lv) {
    var list = groupList(g.id, lv), m = P.mast['g:' + g.id + ':' + lv], st = '';
    for (var i = 0; i < 3; i++) st += '<svg class="' + (i < lv ? 'f' : '') + '"><use href="#i-star"/></svg>';
    var c = el('button', 'sec lvc', '<span class="pips">' + st + '</span><span class="t">Level ' + lv + ' • ' + info[lv - 1][0] + '</span><span class="c">' + info[lv - 1][1] + '</span><span class="c">' + list.length + (list.length === 1 ? ' question' : ' questions') + '</span>' + (m != null ? '<span class="best">Best: ' + m + '%</span>' : ''));
    c.type = 'button'; if (!list.length) { c.disabled = true; c.style.opacity = '.5'; }
    c.addEventListener('click', function () {
      startTest({ key: 'g:' + g.id, title: g.title, mast: 'g:' + g.id + ':' + lv, list: list.slice(), back: function () { showTab('book'); openGroup(g.id, 'try'); } });
    });
    $('#lvg').appendChild(c);
  });
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('.hw'); if (!b) return;
  var w = b.getAttribute('data-w'), span = document.createElement('span'); span.className = 'shown'; span.textContent = w; b.parentNode.replaceChild(span, b); speak(w);
});

/* ===== exams on the test tab ===== */
function examCards(h) {
  var wrap = el('div', 'stack', '<h3 class="sect-title">Exams</h3><div class="sgrid" id="exg"></div><h3 class="sect-title" style="margin-top:10px">More practice</h3>');
  var infos = [[1, 'Level 1 • Easy', 20], [2, 'Level 2 • Medium', 20], [3, 'Level 3 • Hard', 20]];
  var host = $('#exg', wrap);
  infos.forEach(function (x) {
    var lv = x[0], best = P.best['ex' + lv + ':0'], st = '';
    for (var i = 0; i < 3; i++) st += '<svg class="' + (i < lv ? 'f' : '') + '"><use href="#i-star"/></svg>';
    var c = el('button', 'sec lvc', '<span class="pips">' + st + '</span><span class="t">' + x[1] + '</span><span class="c">' + x[2] + ' questions</span>' + (best != null ? '<span class="best">Best: ' + best + '%</span>' : ''));
    c.type = 'button'; c.addEventListener('click', function () { startTest({ key: 'ex' + lv, title: x[1], gen: function () { return examList(lv, x[2]); } }); }); host.appendChild(c);
  });
  var fb = P.best['exF:0'];
  var f = el('button', 'sec big', '<span class="t">Final Exam</span><span class="c">30 questions from all levels</span>' + (fb != null ? '<span class="best">Best: ' + fb + '%</span>' : ''));
  f.type = 'button'; f.addEventListener('click', function () { startTest({ key: 'exF', title: 'Final Exam', gen: function () { return finalExam(30); } }); }); host.appendChild(f);
  var anchor = $('#flt', h); anchor.parentNode.insertBefore(wrap, anchor);
}

/* ===== start ===== */
hydrate(document);
$('#starN').textContent = P.stars;
var h0 = (location.hash || '').replace('#', '');
showTab(['learn', 'words', 'book', 'test'].indexOf(h0) >= 0 ? h0 : 'learn');

})();
</script>
